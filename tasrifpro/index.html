<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TasrifPro - Tasrif Tsulasi Lengkap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📚 TasrifPro</h1>
    <p class="subtitle">Tasrif Tsulasi Mujarrod + Mazid Offline</p>

    <div class="box">
      <<label>Pilih Bab:</label>
<select id="bab" onchange="tampilHuruf()">
  <option value="">-- Pilih Bab --</option>
  <option value="1">Bab 1: فَعَلَ يَفْعُلُ</option>
  <option value="2">Bab 2: فَعِلَ يَفْعَلُ</option>
  <option value="3">Bab 3: فَعَلَ يَفْعِلُ</option>
</select>
        
      <label>Pilih Huruf Awal:</label>
      <select id="huruf" onchange="tampilFiil()">
        <option value="">-- Pilih Huruf --</option>
        <option value="ا">ا - Alif</option>
        <option value="ب">ب - Ba'</option>
        <option value="ت">ت - Ta'</option>
      </select>

      <label>Pilih Fi'il Madhi:</label>
      <select id="fiil" onchange="tampilIstilah()">
        <option value="">-- Pilih Fi'il --</option>
      </select>
    </div>

    <div id="hasil" class="box hasil"></div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
