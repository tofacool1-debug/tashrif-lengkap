<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasrif 7 Bina - OtakManager + IndexedDB</title>
<style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif;}
  body {background:#0f172a; color:#e2e8f0; padding:20px;}
.container {max-width:900px; margin:0 auto;}
  h1 {text-align:center; color:#38bdf8; margin-bottom:20px; font-size:24px;}
  h2 {color:#38bdf8; margin:20px 0 10px; font-size:18px; border-bottom:1px solid #334155; padding-bottom:5px;}
.input-group {display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
  input, select, button, textarea {padding:12px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-size:16px;}
  input {flex:1; min-width:150px;}
  select {width:100px;}
  textarea {width:100%; height:120px; font-family:monospace; direction:ltr; text-align:left;}
  button {background:#0ea5e9; cursor:pointer; border:none; font-weight:bold;}
  button:hover {background:#0284c7;}
  button.danger {background:#ef4444;}
  button.danger:hover {background:#dc2626;}
.result {background:#1e293b; border:1px solid #334155; border-radius:12px; padding:20px; margin-top:20px;}
.info {display:flex; gap:15px; flex-wrap:wrap; margin-bottom:15px; padding-bottom:15px; border-bottom:1px solid #334155;}
.info-item {background:#0f172a; padding:8px 12px; border-radius:6px; font-size:14px;}
.info-item span {color:#38bdf8; font-weight:bold;}
  h3 {color:#38bdf8; margin:15px 0 10px; font-size:18px;}
  table {width:100%; border-collapse:collapse; margin-bottom:20px; font-size:14px;}
  th {background:#334155; padding:10px; text-align:right;}
  td {padding:8px 10px; border-bottom:1px solid #334155;}
  tr:hover {background:#0f172a;}
.iilal {color:#fbbf24; font-size:12px;}
.jamak-group {margin-bottom:25px;}
.jamak-sub {margin-right:20px;}
.mode-switch {text-align:center; margin-bottom:20px;}
.mode-switch button {background:#334155; margin:0 5px;}
.mode-switch button.active {background:#0ea5e9;}
.hidden {display:none;}
.db-info {font-size:12px; color:#94a3b8; margin-top:5px;}
  @media(max-width:600px){
  .input-group {flex-direction:column;}
    table {font-size:12px;}
    th, td {padding:6px;}
  }
</style>
</head>
<body>
<div class="container">
  <h1> OtakManager - Tasrif 7 Bina + IndexedDB</h1>

  <div class="mode-switch">
    <button id="btnSingle" class="active" onclick="switchMode('single')">Single Tasrif</button>
    <button id="btnBulk" onclick="switchMode('bulk')">Bulk Tasrif</button>
  </div>

  <!-- MODE SINGLE -->
  <div id="modeSingle">
    <div class="input-group">
      <input type="text" id="asal" placeholder="Masukkan asal: م د" value="م د">
      <select id="bab">
        <option value="1">Bab 1</option>
        <option value="2">Bab 2</option>
        <option value="3">Bab 3</option>
        <option value="1">Bab 4</option>
        <option value="2">Bab 5</option>
        <option value="3">Bab 6</option>
      </select>
      <button onclick="runTasrif()">Tasrif</button>
    </div>
  </div>

  <!-- MODE BULK -->
  <div id="modeBulk" class="hidden">
    <p class="db-info">Format: asal|bab per baris. Data auto simpan ke IndexedDB</p>
    <textarea id="inputBulk" placeholder="ك ت ب|1
ق ر أ|1
ف ع ل|2"></textarea>
    <div>
      <button onclick="tasrifBulk()">Tasrif Bulk</button>
      <button onclick="exportJSON()">Export JSON</button>
      <button onclick="document.getElementById('fileInput').click()">Import JSON</button>
      <button onclick="resetDB()" class="danger">Reset DB</button>
      <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importJSON(event)">
    </div>
    <p id="dbCount" class="db-info">Total data di DB: 0</p>
  </div>

  <div id="output"></div>
</div>

<script type="module">
import OtakManager from './OtakManager.js';
import InputHandler from './input_handler.js';
import DBHandler from './db_handler.js';

let currentMode = 'single';

// Switch mode
window.switchMode = async function(mode) {
  currentMode = mode;
  document.getElementById('btnSingle').classList.remove('active');
  document.getElementById('btnBulk').classList.remove('active');
  document.getElementById('modeSingle').classList.add('hidden');
  document.getElementById('modeBulk').classList.add('hidden');

  if(mode === 'single') {
    document.getElementById('btnSingle').classList.add('active');
    document.getElementById('modeSingle').classList.remove('hidden');
  } else {
    document.getElementById('btnBulk').classList.add('active');
    document.getElementById('modeBulk').classList.remove('hidden');
    await updateDBCount();
  }
}

// Single tasrif - tetep kayak punya lu
window.runTasrif = async function() {
  try {
    const asal = document.getElementById('asal').value.trim();
    const bab = parseInt(document.getElementById('bab').value);

    if(!asal || asal.split(' ').length !== 3) {
      alert('Format asal harus 3 huruf dipisah spasi. Contoh: ك ت ب');
      return;
    }

    console.log('Input:', asal, bab); // buat debug
    
    const data = OtakManager.tasrif(asal, bab); // pake tasrifLengkap
    console.log('Hasil:', data); // buat debug
    
    tampilkanHasil(data);
    await DBHandler.simpan({asal, bab, hasil: data});
    
  } catch(e) {
    document.getElementById('output').innerHTML = 
      `<div style="color:red; padding:20px">ERROR: ${e.message}<br><br>${e.stack}</div>`;
  }
}

function tampilkanHasil(data) {
  let html = `
    <div class="result">
      <div class="info">
        <div class="info-item">Asal: <span>${data.asal}</span></div>
        <div class="info-item">Bina: <span>${data.bina}</span></div>
        <div class="info-item">Bab: <span>${data.bab}</span></div>
        <div class="info-item">Wazan: <span>${data.wazan}</span></div>
        <div class="info-item">Contoh: <span>${data.keterangan}</span></div>
      </div>
  `;

  html += `<h3>1. Istilah 12</h3><table><tr><th>No</th><th>Nama</th><th>Fi'il</th><th>Wazan</th><th>I'lal</th></tr>`;
  data.istilah.forEach(i => {
    html += `<tr><td>${i.no}</td><td>${i.nama}</td><td>${i.fiil}</td><td>${i.wazan}</td><td class="iilal">${i.iilal || '-'}</td></tr>`;
  });
  html += `</table>`;

  html += `<h3>2. Masdar</h3><table><tr><th>No</th><th>Jenis</th><th>Fi'il</th></tr>`;
  data.masdar.masdar23.forEach(m => html += `<tr><td>${m.no}</td><td>Masdar 2-3</td><td>${m.masdar}</td></tr>`);
  data.masdar.marrah.forEach(m => html += `<tr><td>-</td><td>Marrah</td><td>${m.fiil}</td></tr>`);
  data.masdar.nau.forEach(m => html += `<tr><td>-</td><td>Nau</td><td>${m.fiil}</td></tr>`);
  html += `</table>`;

  html += `<h3>3. Jamak</h3>`;
  for(let key in data.jamak) {
    html += `<div class="jamak-group"><h4>${key}</h4>`;
    for(let sub in data.jamak[key]) {
      html += `<div class="jamak-sub"><b>${sub}:</b><table><tr><th>Wazan</th><th>Fi'il</th><th>Asal</th><th>I'lal</th></tr>`;
      data.jamak[key][sub].forEach(j => {
        html += `<tr><td>${j.wazan}</td><td>${j.fiil}</td><td>${j.asal || '-'}</td><td class="iilal">${j.iilal || '-'}</td></tr>`;
      });
      html += `</table></div>`;
    }
    html += `</div>`;
  }

  html += `<h3>4. Isim Tafdhil</h3><table><tr><th>Mudzakkar</th><th>Muannats</th><th>Jamak</th></tr>`;
  html += `<tr><td>${data.isimTafdhil.mudzakkar}</td><td>${data.isimTafdhil.muannats}</td><td>${data.isimTafdhil.jamak}</td></tr>`;
  html += `</table></div>`;

  document.getElementById('output').innerHTML = html;
}

// Bulk tasrif
window.tasrifBulk = async function() {
  const teks = document.getElementById('inputBulk').value.trim();
  if(!teks) return alert('Isi dulu bang');

  const lines = teks.split('\n').filter(l => l.trim());
  const dataArray = lines.map(line => {
    const [asal, bab] = line.split('|');
    return {asal: asal.trim(), bab: parseInt(bab) || 1};
  });

  document.getElementById('output').innerText = 'Lagi proses...';

  const hasil = await InputHandler.batchInput(dataArray);
  await updateDBCount();

  let output = `Selesai! Total data di DB: ${await InputHandler.getJumlahData()}\n\n`;
  hasil.forEach(h => {
    output += h.status === 'sukses'? `[OK] ${h.asal}\n` : `[ERR] ${h.asal} → ${h.pesan}\n`;
  });

  document.getElementById('output').innerText = output;
}

window.exportJSON = async function() {
  const jumlah = await InputHandler.getJumlahData();
  if(jumlah === 0) return alert('Data kosong bang');
  if(confirm(`Export ${jumlah} data ke JSON?`)) {
    await InputHandler.exportJSON();
    alert('Export selesai!');
  }
}

window.importJSON = function(event) {
  const file = event.target.files[0];
  if(!file) return;
  InputHandler.importJSON(file, async () => {
    await updateDBCount();
    alert('Import selesai!');
  });
}

window.resetDB = async function() {
  if(confirm('Hapus semua data di IndexedDB?')) {
    await DBHandler.hapusSemua();
    await updateDBCount();
    alert('DB dikosongin');
    document.getElementById('output').innerText = 'DB kosong';
  }
}

async function updateDBCount() {
  const count = await DBHandler.getCount();
  document.getElementById('dbCount').innerText = `Total data di DB: ${count}`;
}

// Auto run pertama
runTasrif();
updateDBCount();
</script>
</body>
</html>
