<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasrif 7 Bina - OtakManager</title>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif;}
body {background:#0f172a; color:#e2e8f0; padding:20px;}
.container {max-width:1000px; margin:0 auto;}
h1 {text-align:center; color:#38bdf8; margin-bottom:20px; font-size:24px;}
.input-group {display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
input, select, button {padding:12px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-size:16px;}
input {flex:1; min-width:150px; text-align:right; direction:rtl;}
select {width:120px;}
button {background:#0ea5e9; cursor:pointer; border:none; font-weight:bold;}
button:hover {background:#0284c7;}
.result {background:#1e293b; border:1px solid #334155; border-radius:12px; padding:20px; margin-top:20px;}
.info {display:flex; gap:15px; flex-wrap:wrap; margin-bottom:15px; padding-bottom:15px; border-bottom:1px solid #334155;}
.info-item {background:#0f172a; padding:8px 12px; border-radius:6px; font-size:14px;}
.info-item span {color:#38bdf8; font-weight:bold;}
h3 {color:#38bdf8; margin:20px 0 10px; font-size:18px;}
h4 {color:#94a3b8; margin:10px 0 5px; font-size:15px;}
table {width:100%; border-collapse:collapse; margin-bottom:20px; font-size:14px;}
th {background:#334155; padding:10px; text-align:right; border:1px solid #475569;}
td {padding:8px 10px; border:1px solid #334155; text-align:right;}
tr:hover {background:#0f172a;}
.iilal {color:#fbbf24; font-size:12px;}
.error-box {color:red; background:#2a0000; padding:15px; border-radius:8px; margin-top:15px;}
@media(max-width:600px){
  .input-group {flex-direction:column;}
  table {font-size:12px;}
  th, td {padding:6px;}
}
</style>
</head>
<body>
<div class="container">
  <h1>📚 Tasrif 7 Bina - OtakManager</h1>

  <!-- INPUT + TOMBOL -->
  <div class="input-group">
    <input type="text" id="asal" placeholder="Masukkan asal: ق و ل" value="ق و ل" dir="rtl">
    <select id="bab">
      <option value="1">Bab 1 فَعَلَ يَفْعُلُ</option>
      <option value="2">Bab 2 فَعَلَ يَفْعِلُ</option>
      <option value="3">Bab 3 فَعَلَ يَفْعَلُ</option>
      <option value="4">Bab 4 فَعِلَ يَفْعَلُ</option>
      <option value="5">Bab 5 فَعُلَ يَفْعُلُ</option>
      <option value="6">Bab 6 فَعِلَ يَفْعِلُ</option>
    </select>
    <button onclick="runTasrif()">Tasrif</button>
  </div>

  <!-- INI TEMPAT NEMPEL HASILNYA - WAJIB ADA -->
  <div id="output"></div>
</div>

<script type="module">
import OtakManager from './OtakManager.js'; // O M gede

window.runTasrif = async function() {
  const output = document.getElementById('output');
  try {
    const asal = document.getElementById('asal').value.trim();
    const bab = parseInt(document.getElementById('bab').value);
    
    if(!asal || asal.split(' ').length !== 3) {
      throw new Error('Format asal salah. Harus: ك ت ب atau ق و ل');
    }

    output.innerHTML = `<div style="color:#fbbf24; text-align:center">Lagi proses...</div>`;

    const hasil = OtakManager.tasrif(asal, bab);
    console.log('DATA DARI OTAK:', hasil);

    tampilkanHasil(hasil);

  } catch(e) {
    output.innerHTML = `
      <div class="error-box">
        <b>ERROR:</b> ${e.message}<br><br>
        <small>${e.stack}</small>
      </div>
    `;
    console.error(e);
  }
}

function tampilkanHasil(data) {
  let html = `
    <div class="result">
      <div class="info">
        <div class="info-item">Asal: <span>${data.asal}</span></div>
        <div class="info-item">Bina: <span>${data.bina}</span></div>
        <div class="info-item">Bab: <span>${data.bab}</span></div>
        <div class="info-item">Wazan: <span>${data.wazan}</span></div>
        <div class="info-item">Contoh: <span>${data.keterangan}</span></div>
      </div>
  `;

  // TABEL 1: ISTILAH 12
  html += `<h3>1. Istilah 12</h3>
  <table>
    <tr><th>No</th><th>Nama</th><th>Fi'il</th><th>Wazan</th><th>I'lal</th></tr>`;
  data.istilah.forEach(i => {
    html += `<tr>
      <td>${i.no}</td>
      <td>${i.nama}</td>
      <td style="font-size:18px; font-weight:bold">${i.fiil}</td>
      <td>${i.wazan}</td>
      <td class="iilal">${i.iilal || '-'}</td>
    </tr>`;
  });
  html += `</table>`;

  // TABEL 2: MASDAR
  html += `<h3>2. Masdar</h3><table><tr><th>No</th><th>Jenis</th><th>Fi'il</th></tr>`;
  data.masdar.masdar23.forEach(m => html += `<tr><td>${m.no}</td><td>Masdar 2-3</td><td>${m.masdar}</td></tr>`);
  data.masdar.marrah.forEach(m => html += `<tr><td>-</td><td>Marrah</td><td>${m.fiil}</td></tr>`);
  data.masdar.nau.forEach(m => html += `<tr><td>-</td><td>Nau</td><td>${m.fiil}</td></tr>`);
  html += `</table>`;

  // TABEL 3: ISIM TAFDHIL
  html += `<h3>3. Isim Tafdhil</h3><table><tr><th>Mudzakkar</th><th>Muannats</th><th>Jamak</th></tr>`;
  html += `<tr><td>${data.isimTafdhil.mudzakkar}</td><td>${data.isimTafdhil.muannats}</td><td>${data.isimTafdhil.jamak}</td></tr>`;
  html += `</table></div>`;

  document.getElementById('output').innerHTML = html;
}

// Auto run pertama kali
runTasrif();
</script>
</body>
</html>
