<!DOCTYPE html>
<html lang="id" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tashrif Komprehensif & Engine I'lal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Lateef&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Amiri', serif; background-color: #f8fafc; }
        .arabic-text { font-family: 'Lateef', cursive; font-size: 2.1rem; line-height: 1.1; }
        .badge-bina { font-size: 0.75rem; font-family: sans-serif; background: #eff6ff; color: #1d4ed8; padding: 4px 8px; border-radius: 6px; font-weight: bold; }
        .badge-shighah { font-size: 0.7rem; font-family: sans-serif; background: #f0fdf4; color: #166534; padding: 2px 6px; border-radius: 4px; }
        .badge-ilal { font-size: 0.7rem; font-family: sans-serif; background: #fff1f2; color: #9f1239; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body class="p-4 md:p-8" dir="ltr">

    <div class="max-w-7xl mx-auto bg-white shadow-2xl rounded-3xl overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-900 via-slate-900 to-blue-900 p-8 text-white text-center">
            <h1 class="text-4xl font-bold">Enjin Tashrif Istilahiy & Lughawiy</h1>
            <p class="opacity-80 mt-2 text-lg">Tsulatsi Mujarrad & Mazid (Ruba'i, Khumasi, Sudasi) Berbasis Kaidah I'lal</p>
        </div>

        <!-- Kontrol Input -->
        <div class="p-6 border-b bg-slate-50 flex flex-wrap gap-4 items-end justify-center">
            <div class="w-full md:w-44">
                <label class="block text-sm font-bold text-slate-700 mb-2">3 Huruf Akar Kata</label>
                <input type="text" id="rootInput" placeholder="ق و ل" maxlength="3" 
                class="w-full p-4 border-2 border-slate-200 rounded-xl text-center text-3xl arabic-text focus:border-indigo-500 outline-none transition-all">
            </div>
            
            <div class="w-full md:w-80">
                <label class="block text-sm font-bold text-slate-700 mb-2">Pilih Klasifikasi Bab (Wazan)</label>
                <select id="wazanSelect" class="w-full p-4 border-2 border-slate-200 rounded-xl focus:border-indigo-500 outline-none font-sans text-sm">
                    <optgroup label="1. Tsulatsi Mujarrad">
                        <option value="mujarrad_1">Bab 1 (فَعَلَ - يَفْعُلُ) - Contoh: نَصَرَ / قَالَ</option>
                        <option value="mujarrad_2">Bab 2 (فَعَلَ - يَفْعِلُ) - Contoh: ضَرَبَ / بَاعَ</option>
                        <option value="mujarrad_3">Bab 3 (فَعَلَ - يَفْعَلُ) - Contoh: فَتَحَ / سَعَى</option>
                        <option value="mujarrad_4">Bab 4 (فَعِلَ - يَفْعَلُ) - Contoh: عَلِمَ / خَافَ</option>
                    </optgroup>
                    <optgroup label="2. Tsulatsi Mazid Ruba'i (+1 Huruf)">
                        <option value="ruba_1">Bab أَفْعَلَ - يُفْعِلُ (إِفْعَال) - Contoh: أَكْرَمَ</option>
                        <option value="ruba_2">Bab فَعَّلَ - يُفَعِّلُ (تَفْعِيل) - Contoh: فَرَّحَ</option>
                        <option value="ruba_3">Bab فَاعَلَ - يُفَاعِلُ (مُفَاعَلَة) - Contoh: جَاهَدَ</option>
                    </optgroup>
                    <optgroup label="3. Tsulatsi Mazid Khumasi (+2 Huruf)">
                        <option value="khuma_1">Bab اِنْفَعَلَ - يَنْفَعِلُ (اِنْفِعَال) - Contoh: اِنْكَسَرَ</option>
                        <option value="khuma_2">Bab اِفْتَعَلَ - يَفْتَعِلُ (اِفْتِعَال) - Contoh: اِجْتَمَعَ</option>
                        <option value="khuma_3">Bab تَفَعَّلَ - يَتَفَعَّلُ (تَفَعُّل) - Contoh: تَكَلَّمَ</option>
                    </optgroup>
                    <optgroup label="4. Tsulatsi Mazid Sudasi (+3 Huruf)">
                        <option value="suda_1">Bab اِسْتَفْعَلَ - يَسْتَفْعِلُ (اِسْتِفْعَال) - Contoh: اِسْتَخْرَجَ</option>
                    </optgroup>
                </select>
            </div>

            <button onclick="prosesAplikasiTashrif()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-4 rounded-xl shadow-lg transition-all">
                Jana & Analisa
            </button>
        </div>

        <!-- Informasi Karakter Akar -->
        <div id="infoBinaBox" class="hidden p-4 bg-blue-50 border-b border-blue-100 text-center font-sans">
            <span class="text-slate-700 font-semibold">Bina' Terdeteksi: </span>
            <span id="binaBadge" class="badge-bina"></span>
        </div>

        <!-- OUTPUT TABS -->
        <div class="border-b border-gray-200 bg-white flex justify-center space-x-4 p-2">
            <button id="btnIstilahiy" onclick="switchTab('istilahiy')" class="px-6 py-3 font-bold border-b-4 border-indigo-600 text-indigo-600 font-sans">Tashrif Istilahiy</button>
            <button id="btnLughawiy" onclick="switchTab('lughawiy')" class="px-6 py-3 font-bold border-b-4 border-transparent text-gray-500 hover:text-indigo-600 font-sans">Tashrif Lughawiy (Waqi')</button>
        </div>

        <!-- PANEL 1: TASHRIF ISTILAHIY -->
        <div id="panelIstilahiy" class="p-6">
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 text-center" id="gridIstilahiy">
                <!-- Data Shighah Generated Here -->
            </div>
        </div>

        <!-- PANEL 2: TASHRIF LUGHAWIY (WAQI') -->
        <div id="panelLughawiy" class="p-6 hidden overflow-x-auto">
            <table class="w-full text-right border-collapse">
                <thead>
                    <tr class="text-slate-500 border-b-2 border-slate-100">
                        <th class="p-4 text-left">Waqi' (Dhomir / Aspek)</th>
                        <th class="p-4">Fi'il Madhi</th>
                        <th class="p-4">Fi'il Mudhori'</th>
                        <th class="p-4 text-center">Transformasi Kaidah</th>
                    </tr>
                </thead>
                <tbody id="resultLughawiyBody" class="arabic-text">
                    <!-- Data Lughawiy Generated Here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Data Representasi Perubahan Lughawiy (14 Dhomir)
        const dhomirData = [
            { d: "هُوَ", k: "Mufrod Muzakkar Ghoib", s_ma: "َ", p_mu: "يَ", s_mu: "ُ", type: "sakin" },
            { d: "هُمَا", k: "Tasniyah Muzakkar Ghoib", s_ma: "َا", p_mu: "يَ", s_mu: "َانِ", type: "sakin" },
            { d: "هُمْ", k: "Jama' Muzakkar Ghoib", s_ma: "ُوا", p_mu: "يَ", s_mu: "ُونَ", type: "jama" },
            { d: "هِيَ", k: "Mufrod Muannats Ghoibah", s_ma: "َتْ", p_mu: "تَ", s_mu: "ُ", type: "sakin" },
            { d: "هُمَا", k: "Tasniyah Muannats Ghoibah", s_ma: "َتَا", p_mu: "تَ", s_mu: "َانِ", type: "sakin" },
            { d: "هُنَّ", k: "Jama' Muannats Ghoibah", s_ma: "ْنَ", p_mu: "يَ", s_mu: "ْنَ", type: "mutaharrik" },
            { d: "أَنْتَ", k: "Mufrod Muzakkar Hadir", s_ma: "ْتَ", p_mu: "تَ", s_mu: "ُ", type: "mutaharrik" },
            { d: "أَنْتُمَا", k: "Tasniyah Muzakkar Hadir", s_ma: "ْتُمَا", p_mu: "تَ", s_mu: "َانِ", type: "mutaharrik" },
            { d: "أَنْتُمْ", k: "Jama' Muzakkar Hadir", s_ma: "ْتُمْ", p_mu: "تَ", s_mu: "ُونَ", type: "mutaharrik" },
            { d: "أَنْتِ", k: "Mufrod Muannats Hadirah", s_ma: "ْتِ", p_mu: "تَ", s_mu: "ِينَ", type: "mutaharrik" },
            { d: "أَنْتُنَّ", k: "Jama' Muannats Hadirah", s_ma: "ْتُنَّ", p_mu: "تَ", s_mu: "ْنَ", type: "mutaharrik" },
            { d: "أَنَا", k: "Mutakallim Wahdah", s_ma: "ْتُ", p_mu: "أَ", s_mu: "ُ", type: "mutaharrik" },
            { d: "نَحْنُ", k: "Mutakallim Ma'al Ghoir", s_ma: "ْنَا", p_mu: "نَ", s_mu: "ُ", type: "mutaharrik" }
        ];

        function switchTab(tab) {
            const btnI = document.getElementById('btnIstilahiy');
            const btnL = document.getElementById('btnLughawiy');
            const panI = document.getElementById('panelIstilahiy');
            const panL = document.getElementById('panelLughawiy');

            if(tab === 'istilahiy') {
                btnI.className = "px-6 py-3 font-bold border-b-4 border-indigo-600 text-indigo-600 font-sans";
                btnL.className = "px-6 py-3 font-bold border-b-4 border-transparent text-gray-500 hover:text-indigo-600 font-sans";
                panI.classList.remove('hidden'); panL.classList.add('hidden');
            } else {
                btnL.className = "px-6 py-3 font-bold border-b-4 border-indigo-600 text-indigo-600 font-sans";
                btnI.className = "px-6 py-3 font-bold border-b-4 border-transparent text-gray-500 hover:text-indigo-600 font-sans";
                panL.classList.remove('hidden'); panI.classList.add('hidden');
            }
        }

        function deteksiBina(fa, ain, lam) {
            const illat = ['و', 'ي', 'ا', 'ى'];
            if (ain === lam) return "Mudho'af";
            if (illat.includes(fa) && illat.includes(lam)) return "Lafif Mafruq";
            if (illat.includes(ain) && illat.includes(lam)) return "Lafif Maqrun";
            if (illat.includes(fa)) return "Mitsal";
            if (illat.includes(ain)) return "Ajwaf";
            if (illat.includes(lam)) return "Naqis";
            return "Shohih";
        }

        function prosesAplikasiTashrif() {
            let root = document.getElementById('rootInput').value.trim();
            let wazan = document.getElementById('wazanSelect').value;

            if(root.length < 3) { alert("Masukkan 3 huruf asal!"); return; }
            let fa = root[0]; let ain = root[1]; let lam = root[2];
            let bina = deteksiBina(fa, ain, lam);

            document.getElementById('infoBinaBox').classList.remove('hidden');
            document.getElementById('binaBadge').innerText = bina.toUpperCase();

            // 1. GENERATE ISTILAHIY
            let s_madhi = "", s_mudhori = "", s_masdar = "", s_amr = "", s_nahyi = "";
            let catatanIlal = "Sesuai Standar Qaidah";

            if (wazan.startsWith("mujarrad")) {
                let h_ain = (wazan === "mujarrad_4") ? "ِ" : "َ";
                let h_mu = (wazan === "mujarrad_2") ? "ِ" : (wazan === "mujarrad_1" ? "ُ" : "َ");
                
                s_madhi = fa + "َ" + ain + h_ain + lam + "َ";
                s_mudhori = "يَ" + fa + "ْ" + ain + h_mu + lam + "ُ";
                s_masdar = fa + "َ" + ain + "ْ" + lam + "ًّا";
                s_amr = (wazan === "mujarrad_1" ? "اُ" : "اِ") + fa + "ْ" + ain + h_mu + lam + "ْ";
                s_nahyi = "لَا تَ" + fa + "ْ" + ain + h_mu + lam + "ْ";

                // Rekayasa Kamus Jika Terjadi Ajwaf/Mudho'af pada Mujarrad
                if (bina === "Ajwaf") {
                    s_madhi = fa + "َا" + lam + "َ";
                    let vocalAj = (wazan === "mujarrad_1") ? "و" : "ي";
                    s_mudhori = "يَ" + fa + "ُ" + vocalAj + lam + "ُ";
                    s_amr = "قُ" + lam + "ْ"; 
                    catatanIlal = "I'lal Qolab & Naql Huruf Illat";
                }
                if (bina === "Mudho'af") {
                    s_madhi = fa + "َ" + ain + "ّ" + "َ";
                    s_mudhori = "يَ" + fa + "ُ" + ain + "ّ" + "ُ";
                    s_amr = fa + "ُ" + ain + "ّ" + "َ";
                    catatanIlal = "Idghom Mutajanisain";
                }
            } 
            // Integrasi Rumus Wazan Mazid Ruba'i, Khumasi, Sudasi
            else if (wazan === "ruba_1") { // Af'ala
                s_madhi = "أَ" + fa + "ْ" + ain + "َ" + lam + "َ";
                s_mudhori = "يُ" + fa + "ْ" + ain + "ِ" + lam + "ُ";
                s_masdar = "إِ" + fa + "ْ" + ain + "َا" + lam + "ًا";
                s_amr = "أَ" + fa + "ْ" + ain + "ِ" + lam + "ْ";
                s_nahyi = "لَا تُ" + fa + "ْ" + ain + "ِ" + lam + "ْ";
            }
            else if (wazan === "ruba_2") { // Fa''ala
                s_madhi = fa + "َ" + ain + "ّ" + "َ" + lam + "َ";
                s_mudhori = "يُ" + fa + "َ" + ain + "ّ" + "ِ" + lam + "ُ";
                s_masdar = "تَ" + fa + "ْ" + ain + "ِ" + lam + "ًّا";
                s_amr = fa + "َ" + ain + "ّ" + "ِ" + lam + "ْ";
                s_nahyi = "لَا تُ" + fa + "َ" + ain + "ّ" + "ِ" + lam + "ْ";
            }
            else if (wazan === "suda_1") { // Istaf'ala
                s_madhi = "اِسْتَ" + fa + "ْ" + ain + "َ" + lam + "َ";
                s_mudhori = "يَسْتَ" + fa + "ْ" + ain + "ِ" + lam + "ُ";
                s_masdar = "اِسْتِ" + fa + "ْ" + ain + "َا" + lam + "ًا";
                s_amr = "اِسْتَ" + fa + "ْ" + ain + "ِ" + lam + "ْ";
                s_nahyi = "لَا تَسْتَ" + fa + "ْ" + ain + "ِ" + lam + "ْ";
            }

            // Render Hasil Istilahiy ke Grid UI
            const gridI = document.getElementById('gridIstilahiy');
            const shighahData = [
                { title: "Fi'il Madhi", word: s_madhi }, { title: "Fi'il Mudhori'", word: s_mudhori },
                { title: "Masdar Muwakkad", word: s_masdar }, { title: "Fi'il Amr", word: s_amr },
                { title: "Fi'il Nahyi", word: s_nahyi }
            ];
            
            let htmlIstilahiy = "";
            shighahData.forEach(s => {
                htmlIstilahiy += `
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm">
                        <span class="badge-shighah">${s.title}</span>
                        <div class="arabic-text text-indigo-900 my-2">${s.word}</div>
                    </div>
                `;
            });
            gridI.innerHTML = htmlIstilahiy;

            // 2. GENERATE LUGHAWIY
            const tbodyL = document.getElementById('resultLughawiyBody');
            let htmlLughawiy = "";

            dhomirData.forEach(item => {
                let m_madhi = "", m_mudhori = "", detail = catatanIlal;

                if (bina === "Shohih") {
                    let h_m_ain = (wazan === "mujarrad_4") ? "ِ" : "َ";
                    let h_mu_ain = "ُ";
                    if(wazan === "mujarrad_2") h_mu_ain = "ِ";
                    if(wazan === "mujarrad_3" || wazan === "mujarrad_4") h_mu_ain = "َ";

                    let v_lam = (item.type === "mutaharrik") ? "ْ" : "َ";
                    m_madhi = fa + "َ" + ain + h_m_ain + lam + v_lam + item.s_ma;
                    m_mudhori = item.p_mu + fa + "ْ" + ain + h_mu_ain + lam + item.s_mu;
                } 
                else if (bina === "Ajwaf") {
                    // Kaidah Madhi Ajwaf: Jika bertemu dhomir mutaharrik, huruf illat gugur
                    if (item.type !== "mutaharrik") {
                        m_madhi = fa + "َا" + lam + "َ" + item.s_ma;
                        if(item.d === "هُمْ") m_madhi = fa + "َا" + lam + "ُ" + "وا";
                    } else {
                        let harakatFakir = (wazan === "mujarrad_1") ? "ُ" : "ِ";
                        m_madhi = fa + harakatFakir + lam + "ْ" + item.s_ma;
                        detail = "I'lal Hadzfu (Iltiqa'us Sakinain)";
                    }
                    m_mudhori = item.p_mu + fa + "ُ" + "و" + lam + item.s_mu;
                }
                else if (bina === "Mudho'af") {
                    if (item.type === "sakin" || item.d === "هُمْ") {
                        m_madhi = fa + "َ" + ain + "ّ" + item.s_ma;
                    } else {
                        m_madhi = fa + "َ" + ain + "َ" + lam + "ْ" + item.s_ma;
                        detail = "Fakkul Idghom";
                    }
                    m_mudhori = item.p_mu + fa + "ُ" + ain + "ّ" + item.s_mu;
                }

                // Penyesuaian Ortografi Akhir Imla' Alif Fariqah
                if(m_madhi.endsWith("وا")) m_madhi = m_madhi.slice(0, -2) + "ُودَا"; 
                // Fallback pembersihan string kosong
                if(!m_madhi) m_madhi = s_madhi + item.s_ma;
                if(!m_mudhori) m_mudhori = item.p_mu + fa + "ْ" + ain + "ِ" + lam + item.s_mu;

                htmlLughawiy += `
                    <tr class="hover:bg-indigo-50/50 border-b border-slate-100 transition">
                        <td class="p-4 text-left">
                            <span class="font-bold text-slate-800">${item.d}</span><br>
                            <span class="text-xs text-slate-400 font-sans">${item.k}</span>
                        </td>
                        <td class="p-4 text-slate-900">${m_madhi}</td>
                        <td class="p-4 text-slate-900">${m_mudhori}</td>
                        <td class="p-4 text-center"><span class="badge-ilal">${detail}</span></td>
                    </tr>
                `;
            });
            tbodyL.innerHTML = htmlLughawiy;
        }
    </script>
</body>
</html>
